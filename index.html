<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sổ giá</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#16332C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF3E9;
    --paper-2:#F7FAF3;
    --ink:#16332C;
    --ink-soft:#4C6359;
    --line:#C9CFC3;
    --line-soft:#DBE0D4;
    --turmeric:#D9A441;
    --turmeric-dark:#7A5A1E;
    --brick:#B5453A;
    --brick-dark:#6E2A22;
    --sage:#6E8B7C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;gap:12px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-0.01em;}
  .tag{font-size:13px;color:var(--ink-soft);margin:4px 0 18px;}
  .btn-add{background:var(--ink);color:var(--paper-2);border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
  .btn-add:active{transform:scale(0.98);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-ghost:hover{background:var(--line-soft);}

  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line-soft);}
  .tab-btn{background:none;border:none;padding:10px 4px;margin-right:16px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--turmeric-dark);}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{
    border:1px solid var(--line);background:var(--paper-2);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--ink);font-family:'Inter',sans-serif;
  }
  .toolbar input{flex:1;min-width:140px;}
  .toolbar input:focus, .toolbar select:focus{outline:none;border-color:var(--sage);}
  .stats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:var(--paper-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px;flex:1;min-width:100px;}
  .stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat span{font-size:11.5px;color:var(--ink-soft);}
  .group{background:var(--paper-2);border:1px solid var(--line-soft);border-radius:14px;margin-bottom:16px;overflow:hidden;}
  .group-head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .group-head h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0;}
  .group-head .cat{font-size:12px;color:var(--ink-soft);display:block;margin-top:1px;}
  .group-head-actions{display:flex;gap:6px;flex-shrink:0;}
  .chip-btn{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
  .chip-btn:hover{background:var(--line-soft);color:var(--ink);}
  .rows{border-top:1px solid var(--line-soft);}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);position:relative;}
  .row:last-child{border-bottom:none;}
  .row.best{background:#FBF4E4;}
  .row-main{flex:1;min-width:0;}
  .row-store{font-weight:600;font-size:14px;}
  .row-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .row-price{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .price-now{font-size:15px;font-weight:600;}
  .price-old{font-size:12px;color:var(--brick-dark);text-decoration:line-through;margin-right:6px;}
  .unit-price{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .stamp{
    position:absolute;left:8px;top:8px;
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--turmeric-dark);color:var(--turmeric-dark);
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:9px;line-height:1.15;
    transform:rotate(-14deg);pointer-events:none;
  }
  .row.best{padding-left:70px;}
  .row-actions{display:flex;gap:2px;flex-shrink:0;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;padding:8px;border-radius:8px;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty h3{font-family:'Fraunces',serif;color:var(--ink);font-size:20px;margin-bottom:6px;}
  .overlay{position:fixed;inset:0;background:rgba(22,51,44,0.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--paper-2);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:560px;}
  .modal h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input, .field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--sage);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;}
  .btn-cancel{background:none;border:1px solid var(--line) !important;color:var(--ink-soft);}
  .btn-save{background:var(--ink);color:var(--paper-2);}
  .confirm-box{background:var(--paper-2);border-radius:14px;padding:20px;max-width:320px;text-align:center;}
  .confirm-box p{font-size:14px;margin:0 0 16px;}
  .loading{text-align:center;padding:60px;color:var(--ink-soft);font-size:14px;}
  .banner{background:#FBE9E7;border:1px solid var(--brick);color:var(--brick-dark);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px;line-height:1.5;}
  .banner code{background:rgba(0,0,0,0.06);padding:1px 5px;border-radius:4px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:14px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;overflow:hidden;max-width:88vw;}
  .toast.show{opacity:1;pointer-events:auto;}
  .toast-bar-track{position:absolute;left:0;bottom:0;width:100%;height:3px;background:rgba(255,255,255,0.18);}
  .toast-bar{height:100%;width:100%;background:var(--turmeric);}
  .chart-wrap{background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:12px;margin-bottom:6px;}

  .shop-item{display:flex;align-items:center;gap:10px;background:var(--paper-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .shop-item.done{opacity:0.5;}
  .shop-item.done .shop-name{text-decoration:line-through;}
  .shop-check{width:20px;height:20px;flex-shrink:0;accent-color:var(--turmeric-dark);cursor:pointer;}
  .shop-main{flex:1;min-width:0;}
  .shop-name{font-weight:600;font-size:14.5px;}
  .shop-note{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  .fab{
    display:none;
    position:fixed;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    width:56px;height:56px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper-2);
    border:none;
    font-size:28px;
    line-height:1;
    align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(22,51,44,0.35);
    cursor:pointer;
    z-index:45;
  }
  .fab:active{transform:scale(0.95);}

  @media (max-width: 640px){
    .fab{ display:flex; }
    .head .btn-add{ display:none; }
    .wrap{ padding-bottom:100px; }
    table.data-table th:nth-child(1), table.data-table td:nth-child(1),
    table.data-table th:nth-child(3), table.data-table td:nth-child(3),
    table.data-table th:nth-child(5), table.data-table td:nth-child(5),
    table.data-table th:nth-child(6), table.data-table td:nth-child(6),
    table.data-table th:nth-child(7), table.data-table td:nth-child(7),
    table.data-table th:nth-child(8), table.data-table td:nth-child(8),
    table.data-table th:nth-child(11), table.data-table td:nth-child(11),
    table.data-table th:nth-child(13), table.data-table td:nth-child(13){
      display:none;
    }
    table.data-table th:nth-child(2), table.data-table td:nth-child(2){
      position:sticky; left:0; background:var(--paper-2); z-index:2;
      box-shadow:2px 0 5px rgba(0,0,0,0.07);
    }
    table.data-table tbody tr:hover td:nth-child(2){ background:#EAF0E4; }
  }
  @media (max-width: 420px){
    .view-switch button{ padding:7px 9px; font-size:11px; }
    .tab-btn{ margin-right:12px; font-size:13.5px; }
    h1{ font-size:26px; }
  }

  .view-switch{display:flex;gap:4px;margin-bottom:14px;background:var(--paper-2);border:1px solid var(--line-soft);border-radius:10px;padding:3px;width:fit-content;}
  .view-switch button{background:none;border:none;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-radius:7px;font-family:'Inter',sans-serif;}
  .view-switch button.active{background:var(--ink);color:var(--paper-2);}
  .table-scroll{overflow-x:auto;background:var(--paper-2);border:1px solid var(--line-soft);border-radius:12px;}
  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  table.data-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);cursor:pointer;font-weight:600;color:var(--ink-soft);user-select:none;position:sticky;top:0;background:var(--paper-2);}
  table.data-table th:hover{color:var(--ink);}
  table.data-table th.num, table.data-table td.num{text-align:right;}
  table.data-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
  table.data-table tbody tr:hover td{background:#EAF0E4;}
  table.data-table td.actions{text-align:right;}
  .group-thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line-soft);flex-shrink:0;}
  .group-head-main{display:flex;align-items:center;gap:10px;}
  .table-thumb{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line-soft);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Đang tải sổ giá...</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="./config.js"></script>
<script>
const NOT_CONFIGURED = !SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_SUPABASE_URL') === 0;
const COMMON_UNITS = ['kg','g','lít','ml','cái','quả','viên','miếng','chục'];
const COMMON_PACKAGE_TYPES = ['lon','chai','hộp giấy','hộp nhựa','hộp','túi','gói','thùng','vỉ','bó','cây','ổ','lọ','bịch'];
let sb = null;
if(!NOT_CONFIGURED){
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let session = null;
let locked = false;
let authError = '';
let authBusy = false;
let authMode = 'login'; // 'login' | 'forgot' | 'forgotSent' | 'reset'

let activeTab = 'gia'; // 'gia' | 'shop'
let products = [];
let shopping = [];
let loaded = false;
let loadError = null;

let filterText = '';
let filterStore = '';
let filterCategory = '';
let sortMode = 'category'; // 'category' | 'name' | 'price' | 'recent'
let viewMode = 'product'; // 'product' | 'store' | 'table'
let tableSortKey = 'name';
let tableSortDir = 'asc';

(function restoreFilterState(){
  try{
    const saved = JSON.parse(localStorage.getItem('so_gia_filters_v1') || 'null');
    if(saved){
      filterText = saved.filterText || '';
      filterStore = saved.filterStore || '';
      filterCategory = saved.filterCategory || '';
      sortMode = saved.sortMode || 'category';
      viewMode = saved.viewMode || 'product';
    }
  }catch(e){}
})();
function saveFilterState(){
  try{
    localStorage.setItem('so_gia_filters_v1', JSON.stringify({filterText, filterStore, filterCategory, sortMode, viewMode}));
  }catch(e){}
}
function setFilterText(v){ filterText = v; saveFilterState(); render(); }
function setFilterStore(v){ filterStore = v; saveFilterState(); render(); }
function setFilterCategory(v){ filterCategory = v; saveFilterState(); render(); }
function setSortMode(v){ sortMode = v; saveFilterState(); render(); }

let editingId = null;
let confirmDeleteId = null;
let confirmDeleteShopId = null;
let showForm = false;
let showManage = false;
let saving = false;
let historyKey = null;
let historyChart = null;
let removeImageFlag = false;
let showAdvancedFields = false;

function fmtVND(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Math.round(n).toLocaleString('vi-VN') + '₫';
}
function fmtUnit(n, unit){
  if(n===null||n===undefined||isNaN(n)||!isFinite(n)) return '—';
  const rounded = n < 1000 ? Math.round(n*100)/100 : Math.round(n);
  return rounded.toLocaleString('vi-VN') + '₫/' + unit;
}
function effectivePrice(p){
  return (p.sale_price !== null && p.sale_price !== undefined && p.sale_price > 0) ? p.sale_price : p.price;
}
function unitPrice(p){
  const qty = parseFloat(p.qty);
  if(!qty || qty <= 0) return NaN;
  return effectivePrice(p) / qty;
}
function storeLabel(p){
  return p.branch ? p.store + ' · ' + p.branch : p.store;
}
function cmpEmptyStr(x,y){
  x = (x||'').trim(); y = (y||'').trim();
  if(!x && y) return 1;
  if(x && !y) return -1;
  return x.localeCompare(y,'vi');
}
function matchesSearch(p, q){
  if(!q) return true;
  const fields = [
    p.name, p.brand, p.store, p.branch, p.unit, p.package_type, p.subcategory, p.subcategory2,
    ...(p.categories||[])
  ];
  return fields.some(v => v && v.toLowerCase().includes(q));
}
function matchesSearchGroup(g, q){
  if(!q) return true;
  if(g.name.toLowerCase().includes(q)) return true;
  return g.items.some(p => matchesSearch(p, q));
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function showToast(msg){
  if(typeof undoTimeoutId !== 'undefined' && undoTimeoutId){
    clearTimeout(undoTimeoutId);
    undoTimeoutId = null;
    const commit = pendingCommit;
    pendingUndo = null; pendingCommit = null;
    if(commit) commit();
  }
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
let undoTimeoutId = null;
let pendingUndo = null;
let pendingCommit = null;
function showUndoToast(msg, onUndo, onCommit){
  if(undoTimeoutId){ clearTimeout(undoTimeoutId); if(pendingCommit) pendingCommit(); }
  const duration = 8000;
  const t = document.getElementById('toast');
  t.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;">' +
    '<span>'+escapeHtml(msg)+'</span>' +
    '<button onclick="triggerUndo()" style="text-decoration:underline;background:none;border:none;color:var(--turmeric);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;">Hoàn tác</button>' +
    '</div>' +
    '<div class="toast-bar-track"><div class="toast-bar" id="toastBar"></div></div>';
  t.classList.add('show');
  const bar = document.getElementById('toastBar');
  if(bar){
    bar.style.transition = 'none';
    bar.style.width = '100%';
    void bar.offsetWidth; // ép trình duyệt vẽ lại trước khi bắt đầu transition
    bar.style.transition = 'width ' + duration + 'ms linear';
    bar.style.width = '0%';
  }
  pendingUndo = onUndo;
  pendingCommit = onCommit;
  undoTimeoutId = setTimeout(()=>{
    t.classList.remove('show');
    const commit = pendingCommit;
    pendingUndo = null; pendingCommit = null; undoTimeoutId = null;
    if(commit) commit();
  }, duration);
}
function triggerUndo(){
  if(undoTimeoutId){ clearTimeout(undoTimeoutId); undoTimeoutId = null; }
  const undo = pendingUndo;
  pendingUndo = null; pendingCommit = null;
  document.getElementById('toast').classList.remove('show');
  if(undo) undo();
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function switchTab(t){ activeTab = t; render(); }

function renderLock(){
  if(authMode === 'forgot'){ renderForgotForm(); return; }
  if(authMode === 'forgotSent'){ renderForgotSent(); return; }
  if(authMode === 'reset'){ renderResetPassword(); return; }
  const app = document.getElementById('app');
  app.innerHTML =
    '<div style="max-width:320px;margin:70px auto 0;text-align:center;">' +
    '<h1 style="font-family:\'Fraunces\',serif;font-size:26px;margin-bottom:4px;">🔒 Sổ giá</h1>' +
    '<p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Đăng nhập để mở app</p>' +
    '<form onsubmit="tryLogin(event)">' +
    '<input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:8px;box-sizing:border-box;">' +
    '<input type="password" id="loginPassword" placeholder="Mật khẩu" autocomplete="current-password" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box;">' +
    (authError ? '<div style="color:var(--brick);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(authError)+'</div>' : '') +
    '<button type="submit" class="btn-add" style="width:100%;" '+(authBusy?'disabled':'')+'>'+(authBusy?'Đang đăng nhập...':'Đăng nhập')+'</button>' +
    '</form>' +
    '<button type="button" onclick="showForgotForm()" style="background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:14px;font-family:Inter,sans-serif;">Quên mật khẩu?</button>' +
    '</div>';
  const input = document.getElementById('loginEmail');
  if(input) input.focus();
}
function showForgotForm(){ authMode='forgot'; authError=''; render(); }
function backToLogin(){ authMode='login'; authError=''; render(); }
function renderForgotForm(){
  const app = document.getElementById('app');
  app.innerHTML =
    '<div style="max-width:320px;margin:70px auto 0;text-align:center;">' +
    '<h1 style="font-family:\'Fraunces\',serif;font-size:22px;margin-bottom:4px;">Quên mật khẩu</h1>' +
    '<p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Nhập email để nhận link đặt lại mật khẩu</p>' +
    '<form onsubmit="sendResetEmail(event)">' +
    '<input type="email" id="forgotEmail" placeholder="Email" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box;">' +
    (authError ? '<div style="color:var(--brick);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(authError)+'</div>' : '') +
    '<button type="submit" class="btn-add" style="width:100%;" '+(authBusy?'disabled':'')+'>'+(authBusy?'Đang gửi...':'Gửi email')+'</button>' +
    '</form>' +
    '<button type="button" onclick="backToLogin()" style="background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:14px;font-family:Inter,sans-serif;">Quay lại đăng nhập</button>' +
    '</div>';
  const input = document.getElementById('forgotEmail');
  if(input) input.focus();
}
async function sendResetEmail(e){
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value.trim();
  authBusy = true; authError = ''; render();
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if(error) throw error;
    authMode = 'forgotSent';
  }catch(err){
    authError = 'Không gửi được email, kiểm tra lại địa chỉ.';
  }
  authBusy = false;
  render();
}

    title: 'Khôi phục dữ liệu',
    message: 'Dữ liệu trong file sẽ được thêm vào (hoặc ghi đè nếu trùng) dữ liệu hiện tại, không xóa các mục khác. Tiếp tục?',
    showInput: false,
    confirmLabel: 'Khôi phục',
    onConfirm: async ()=>{
      try{
        const text = await file.text();
        const backup = JSON.parse(text);
        if(!backup || !Array.isArray(backup.products)) throw new Error('File sao lưu không đúng định dạng');
        if(backup.products.length){
          const { error: e1 } = await sb.from('products').upsert(backup.products);

        if(Array.isArray(backup.shopping_list) && backup.shopping_list.length){

        await loadData();
      }catch(e){

      }
    }
  });
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000;
  quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Không đọc được file ảnh'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Không đọc được ảnh'));
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob)=>{
          if(blob) resolve(blob); else reject(new Error('Không nén được ảnh'));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitForm(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const brand = f.brand.value.trim();
  const store = f.store.value.trim();
  const branch = f.branch.value.trim();
  const categories = f.category.value.split(',').map(s=>s.trim()).filter(Boolean);
  const subcategory = f.subcategory.value.trim();
  const subcategory2 = f.subcategory2.value.trim();
  const unit = f.unit.value.trim() || 'sp';
  const package_type = f.packageType.value.trim();
  const qty = parseFloat(f.qty.value);
  const price = parseFloat(f.price.value);
  const salePriceRaw = f.salePrice.value;
  const sale_price = salePriceRaw === '' ? null : parseFloat(salePriceRaw);
  const date = f.date.value || todayStr();

  if(!name || !store || !qty || qty<=0 || !price || price<0) return;

  saving = true; render();
  try{
    const editing = editingId ? products.find(p=>p.id===editingId) : null;
    let image_url = editing ? (editing.image_url || null) : null;
    if(removeImageFlag){ image_url = null; }
    const file = f.image && f.image.files && f.image.files[0];
    if(file){
      const compressed = await compressImage(file, 1000, 0.75);
      const filePath = Date.now() + '_img.jpg';
      const { error: upErr } = await sb.storage.from('product-images').upload(filePath, compressed, { upsert: true, contentType: 'image/jpeg' });
      if(upErr) throw upErr;
      const { data: urlData } = sb.storage.from('product-images').getPublicUrl(filePath);
      image_url = urlData.publicUrl;
    }
    const payload = {name, brand: brand || null, store, branch: branch || null, categories: categories.length ? categories : null, subcategory: subcategory || null, subcategory2: subcategory2 || null, unit, package_type: package_type || null, qty, price, sale_price, date, image_url};
    if(editingId){
      const { error } = await sb.from('products').update(payload).eq('id', editingId);
      if(error) throw error;
    }else{
      const { error } = await sb.from('products').insert([payload]);
      if(error) throw error;
    }
    showToast('Đã lưu');
    closeForm();
    await loadData();
  }catch(e){
    showToast('Lỗi: ' + (e.message || e));
    saving = false; render();
  }
}

/* ---------- Nhóm / lọc / sắp xếp ---------- */
function getStores(){ return Array.from(new Set(products.map(p=>p.store))).sort(); }
function getCategories(){
  const set = new Set();
  products.forEach(p=>{ (p.categories||[]).forEach(c=>{ if(c) set.add(c); }); });
  return Array.from(set).sort();
}

function groupProducts(){
  const groups = {};
  products.forEach(p=>{
    const key = p.name.trim().toLowerCase();
    if(!groups[key]) groups[key] = {key, name: p.name, subcategory: p.subcategory, subcategory2: p.subcategory2, items: []};
    groups[key].items.push(p);
  });
  let list = Object.values(groups);

  if(filterText.trim()){
    const q = filterText.trim().toLowerCase();
    list = list.filter(g=>matchesSearchGroup(g, q));
  }
  if(filterCategory){
    list = list.filter(g => g.items.some(p=> (p.categories||[]).includes(filterCategory)));
  }

  list.forEach(g=>{
    g.categories = Array.from(new Set(g.items.flatMap(p=>p.categories||[]))).filter(Boolean);
    const latestByStore = {};
    g.items.forEach(p=>{
      const comboKey = p.store + '‖' + (p.branch||'') + '‖' + p.unit + '‖' + p.qty + '‖' + (p.package_type||'');
      const cur = latestByStore[comboKey];
      if(!cur || p.date > cur.date) latestByStore[comboKey] = p;
    });
    g.display = Object.values(latestByStore);
    if(filterStore) g.display = g.display.filter(p=>p.store===filterStore);
    g.display.sort((a,b)=>{
      const ua = unitPrice(a), ub = unitPrice(b);
      if(isNaN(ua)) return 1;
      if(isNaN(ub)) return -1;
      return ua - ub;
    });
    g.bestUnit = g.display.length ? unitPrice(g.display[0]) : NaN;
    g.lastUpdate = g.items.reduce((max,p)=> p.date > max ? p.date : max, '0000-00-00');
  });

  if(filterStore) list = list.filter(g=>g.display.length>0);

  if(sortMode === 'name'){
    list.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  }else if(sortMode === 'price'){
    list.sort((a,b)=>{
      if(isNaN(a.bestUnit)) return 1;
      if(isNaN(b.bestUnit)) return -1;
      return a.bestUnit - b.bestUnit;
    });
  }else if(sortMode === 'recent'){
    list.sort((a,b)=> b.lastUpdate.localeCompare(a.lastUpdate));
  }else if(sortMode === 'category'){
    list.sort((a,b)=>{
      let c = cmpEmptyStr((a.categories||[])[0], (b.categories||[])[0]);
      if(c!==0) return c;
      c = cmpEmptyStr(a.subcategory, b.subcategory);
      if(c!==0) return c;
      c = cmpEmptyStr(a.subcategory2, b.subcategory2);
      if(c!==0) return c;
      return a.name.localeCompare(b.name,'vi');
    });
  }
  return list;
}

/* ---------- Xem theo cửa hàng ---------- */
function groupByStore(){
  const combos = {};
  products.forEach(p=>{
    if(filterText.trim() && !matchesSearch(p, filterText.trim().toLowerCase())) return;
    if(filterCategory && !(p.categories||[]).includes(filterCategory)) return;
    if(filterStore && p.store !== filterStore) return;
    const comboKey = p.store + '‖' + (p.branch||'');
    if(!combos[comboKey]) combos[comboKey] = { store: p.store, branch: p.branch||'', items: {} };
    const key = p.name.trim().toLowerCase() + '‖' + p.unit + '‖' + p.qty + '‖' + (p.package_type||'');
    const cur = combos[comboKey].items[key];
    if(!cur || p.date > cur.date) combos[comboKey].items[key] = p;
  });
  let list = Object.values(combos).map(c => ({
    store: c.store,
    branch: c.branch,
    items: Object.values(c.items).sort((a,b)=>a.name.localeCompare(b.name,'vi'))
  }));
  list.sort((a,b)=> a.store.localeCompare(b.store,'vi') || a.branch.localeCompare(b.branch,'vi'));
  return list;
}

/* ---------- Xem dạng bảng ---------- */
function tableSortValue(p, key){
  switch(key){
    case 'name': return p.name.toLowerCase();
    case 'brand': return (p.brand||'').toLowerCase();
    case 'store': return p.store.toLowerCase();
    case 'branch': return (p.branch||'').toLowerCase();
    case 'category': return (p.categories||[]).join(', ').toLowerCase();
    case 'subcategory': return (p.subcategory||'').toLowerCase();
    case 'subcategory2': return (p.subcategory2||'').toLowerCase();
    case 'unit': return p.unit.toLowerCase();
    case 'package_type': return (p.package_type||'').toLowerCase();
    case 'qty': return parseFloat(p.qty) || 0;
    case 'price': return parseFloat(p.price) || 0;
    case 'sale_price': return (p.sale_price!=null && p.sale_price!=='') ? parseFloat(p.sale_price) : Infinity;
    case 'date': return p.date;
    case 'unitPrice': { const u = unitPrice(p); return isNaN(u) ? Infinity : u; }
    default: return '';
  }
}
function getTableRows(){
  let rows = products.slice();
  if(filterText.trim()){
    const q = filterText.trim().toLowerCase();
    rows = rows.filter(p=>matchesSearch(p, q));
  }
  if(filterStore) rows = rows.filter(p=>p.store===filterStore);
  if(filterCategory) rows = rows.filter(p=>(p.categories||[]).includes(filterCategory));
  rows.sort((a,b)=>{
    const va = tableSortValue(a, tableSortKey), vb = tableSortValue(b, tableSortKey);
    let cmp = (typeof va === 'string') ? va.localeCompare(vb,'vi') : (va - vb);
    return tableSortDir === 'asc' ? cmp : -cmp;
  });
  return rows;
}
function toggleTableSort(key){
  if(tableSortKey === key){ tableSortDir = tableSortDir === 'asc' ? 'desc' : 'asc'; }
  else { tableSortKey = key; tableSortDir = 'asc'; }
  render();
}
function setViewMode(v){ viewMode = v; saveFilterState(); render(); }


function openHistory(key){
  historyKey = key;
  render();
  setTimeout(()=>{
    const canvas = document.getElementById('historyCanvas');
    if(!canvas) return;
    const entries = products.filter(p=>p.name.trim().toLowerCase()===key);
    const variantOf = e => e.unit + '‖' + e.qty + '‖' + (e.package_type||'');
    const hasMultipleVariants = new Set(entries.map(variantOf)).size > 1;
    const combos = Array.from(new Set(entries.map(e=> e.store + '‖' + (e.branch||'') + '‖' + variantOf(e))));
    const dates = Array.from(new Set(entries.map(e=>e.date))).sort();
    const colors = ['#16332C','#B5453A','#D9A441','#6E8B7C','#4C6359','#2E5B4E'];
    const datasets = combos.map((combo,i)=>{
      const [comboStore, comboBranch, comboUnit, comboQty, comboPkg] = combo.split('‖');
      let label = comboBranch ? comboStore + ' · ' + comboBranch : comboStore;
      if(hasMultipleVariants) label += ' (' + comboQty + ' ' + comboUnit + (comboPkg ? ' · ' + comboPkg : '') + ')';
      const byDate = {};
      entries.filter(e=> (e.store+'‖'+(e.branch||'')+'‖'+variantOf(e)) === combo).forEach(e=>{ byDate[e.date] = unitPrice(e); });
      return {
        label: label,
        data: dates.map(d => byDate[d] !== undefined ? byDate[d] : null),
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length],
        spanGaps: true,
        tension: 0.25,
        pointRadius: 3
      };
    });
    if(historyChart) historyChart.destroy();
    historyChart = new Chart(canvas, {
      type: 'line',
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' } } } },
        scales: { y: { ticks: { callback: v => Math.round(v).toLocaleString('vi-VN') + '₫' } } }
      }
    });
  }, 30);
}
function closeHistory(){
  historyKey = null;
  if(historyChart){ historyChart.destroy(); historyChart = null; }
  render();
}

/* ---------- Xuất CSV ---------- */
function exportCSV(){
  const headers = ['Tên sản phẩm','Thương hiệu','Cửa hàng','Chi nhánh','Danh mục','Danh mục con','Danh mục con cấp 2','Đơn vị tính','Loại bao bì','Định lượng','Giá tiền','Giá sau khuyến mãi','Ngày cập nhật','Đơn giá quy đổi'];
  const rows = products.map(p => [
    p.name, p.brand||'', p.store, p.branch||'', (p.categories||[]).join('; '), p.subcategory||'', p.subcategory2||'', p.unit, p.package_type||'', p.qty, p.price, p.sale_price ?? '', p.date,
    isNaN(unitPrice(p)) ? '' : Math.round(unitPrice(p))
  ]);
  const csvLines = [headers, ...rows].map(r =>
    r.map(v => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',')
  );
  const csv = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'so-gia-' + todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Danh sách mua sắm ---------- */
async function addShopItem(name, note){
  name = (name||'').trim();
  if(!name) return;
  try{
    const { error } = await sb.from('shopping_list').insert([{ name, note: note || null, done: false }]);
    if(error) throw error;
    showToast('Đã thêm vào danh sách mua');
    await loadData();
  }catch(e){
    showToast('Lỗi: ' + (e.message || e));
  }
}
function quickAddToShop(groupKey){
  const g = groupProducts().find(x=>x.key===groupKey);
  if(!g || !g.display.length) return;
  const best = g.display[0];
  const note = storeLabel(best) + ' · ' + fmtUnit(unitPrice(best), best.unit);
  addShopItem(g.name, note);
}
async function submitShopForm(e){
  e.preventDefault();
  const f = e.target;
  await addShopItem(f.name.value, f.note.value.trim());
  f.reset();
}
async function toggleShopDone(id, done){
  try{
    const { error } = await sb.from('shopping_list').update({ done }).eq('id', id);
    if(error) throw error;
    const item = shopping.find(s=>s.id===id);
    if(item) item.done = done;
    render();
  }catch(e){
    showToast('Lỗi: ' + (e.message || e));
  }
}
function askDeleteShop(id){ confirmDeleteShopId = id; render(); }
function cancelDeleteShop(){ confirmDeleteShopId = null; render(); }
function doDeleteShop(){
  const id = confirmDeleteShopId;
  confirmDeleteShopId = null;
  const idx = shopping.findIndex(s=>s.id===id);
  if(idx === -1){ render(); return; }
  const removed = shopping[idx];
  shopping.splice(idx, 1);
  render();
  showUndoToast('Đã xóa "'+removed.name+'"', ()=>{
    shopping.splice(idx, 0, removed);
    render();
  }, async ()=>{
    try{
      const { error } = await sb.from('shopping_list').delete().eq('id', id);
      if(error) throw error;
    }catch(e){
      showToast('Lỗi khi xóa: ' + (e.message || e));
      await loadData();
    }
  });
}
async function clearDoneShop(){
  const doneIds = shopping.filter(s=>s.done).map(s=>s.id);
  if(doneIds.length===0) return;
  try{
    const { error } = await sb.from('shopping_list').delete().in('id', doneIds);
    if(error) throw error;
    await loadData();
  }catch(e){
    showToast('Lỗi: ' + (e.message || e));
  }
}

function renderProductView(){
  const groups = groupProducts();
  let html = '';
  if(groups.length===0){
    html += '<div class="empty"><h3>Không tìm thấy</h3><p>Thử đổi từ khóa tìm kiếm hoặc bộ lọc.</p></div>';
    return html;
  }

  if(sortMode !== 'category'){
    groups.forEach(g=>{ html += renderGroupCard(g, true); });
    return html;
  }

  // Chế độ theo danh mục: 1 sản phẩm có nhiều danh mục sẽ hiện dưới MỖI danh mục đó
  const buckets = {};
  groups.forEach(g=>{
    const cats = (g.categories && g.categories.length) ? g.categories : ['Khác'];
    cats.forEach(cat=>{
      if(!buckets[cat]) buckets[cat] = [];
      buckets[cat].push(g);
    });
  });
  const catNames = Object.keys(buckets).sort((a,b)=>{
    if(a==='Khác') return b==='Khác' ? 0 : 1;
    if(b==='Khác') return -1;
    return a.localeCompare(b,'vi');
  });

  catNames.forEach(cat=>{
    html += categoryHeaderHtml(cat, 1);
    const catGroups = buckets[cat].slice().sort((a,b)=>{
      let c = cmpEmptyStr(a.subcategory, b.subcategory);
      if(c!==0) return c;
      c = cmpEmptyStr(a.subcategory2, b.subcategory2);
      if(c!==0) return c;
      return a.name.localeCompare(b.name,'vi');
    });
    let lastSub = null, lastSub2 = null;
    catGroups.forEach(g=>{
      const sub = (g.subcategory||'').trim();
      const sub2 = (g.subcategory2||'').trim();
      if(sub && sub !== lastSub){
        html += categoryHeaderHtml(sub, 2);
        lastSub = sub; lastSub2 = null;
      }else if(!sub){
        lastSub = null;
      }
      if(sub2 && sub2 !== lastSub2){
        html += categoryHeaderHtml(sub2, 3);
        lastSub2 = sub2;
      }else if(!sub2){
        lastSub2 = null;
      }
      html += renderGroupCard(g, false);
    });
  });
  return html;
}

function renderShopTab(){
  const names = Array.from(new Set(products.map(p=>p.name))).sort();
  let html = '';
  html += '<form onsubmit="submitShopForm(event)" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">';
  html += '<input name="name" list="dl-shop-names" placeholder="Tên sản phẩm cần mua..." required style="flex:2;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:Inter,sans-serif;background:var(--paper-2);color:var(--ink);">';
  html += '<input name="note" placeholder="Ghi chú (tùy chọn)" style="flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:Inter,sans-serif;background:var(--paper-2);color:var(--ink);">';
  html += '<button type="submit" class="btn-add">+ Thêm</button>';
  html += '<datalist id="dl-shop-names">'+names.map(n=>'<option value="'+escapeHtml(n)+'">').join('')+'</datalist>';
  html += '</form>';

  if(shopping.length===0){
    html += '<div class="empty"><h3>Danh sách trống</h3><p>Thêm sản phẩm cần mua, hoặc bấm "🛒 Thêm vào ds mua" ở tab Sổ giá.</p></div>';
    return html;
  }

  const pending = shopping.filter(s=>!s.done);
  const done = shopping.filter(s=>s.done);

  [...pending, ...done].forEach(item=>{
    html += '<div class="shop-item'+(item.done?' done':'')+'">';
    html += '<input type="checkbox" class="shop-check" '+(item.done?'checked':'')+' onchange="toggleShopDone(\''+item.id+'\', this.checked)">';
    html += '<div class="shop-main"><div class="shop-name">'+escapeHtml(item.name)+'</div>';
    if(item.note) html += '<div class="shop-note">'+escapeHtml(item.note)+'</div>';
    html += '</div>';
    html += '<button class="icon-btn" onclick="askDeleteShop(\''+item.id+'\')" aria-label="Xóa">✕</button>';
    html += '</div>';
  });

  if(done.length>0){
    html += '<div style="text-align:center;margin-top:10px;"><button class="btn-ghost" onclick="clearDoneShop()">Xóa các mục đã mua ('+done.length+')</button></div>';
  }
  return html;
}

function renderForm(){
  const editing = editingId ? products.find(p=>p.id===editingId) : null;
  const names = Array.from(new Set(products.map(p=>p.name))).sort();
  const brandsList = Array.from(new Set(products.map(p=>p.brand).filter(Boolean))).sort();
  const storesList = getStores();
  const branchesList = Array.from(new Set(products.map(p=>p.branch).filter(Boolean))).sort();
  const categoriesList = getCategories();
  const subcategoriesList = Array.from(new Set(products.map(p=>p.subcategory).filter(Boolean))).sort();
  const subcategories2List = Array.from(new Set(products.map(p=>p.subcategory2).filter(Boolean))).sort();
  const unitsList = Array.from(new Set([...COMMON_UNITS, ...products.map(p=>p.unit).filter(Boolean)]));
  const packageTypesList = Array.from(new Set([...COMMON_PACKAGE_TYPES, ...products.map(p=>p.package_type).filter(Boolean)]));
  const hasAdvancedData = !!(editing && (editing.branch || (editing.categories&&editing.categories.length) || editing.subcategory || editing.subcategory2 || editing.package_type || editing.sale_price || editing.image_url));
  showAdvancedFields = showAdvancedFields || hasAdvancedData;

  let html = '<div class="overlay" onclick="if(event.target===this) closeForm()">';
  html += '<div class="modal">';
  html += '<h2>'+(editing?'Sửa giá':'Thêm giá mới')+'</h2>';
  html += '<form onsubmit="submitForm(event)">';
  html += '<div class="field"><label>Tên sản phẩm</label><input name="name" list="dl-names" required value="'+escapeHtml(editing?editing.name:'')+'" placeholder="VD: Sữa tươi Vinamilk 1L"></div>';
  html += '<div class="field"><label>Thương hiệu</label><input name="brand" list="dl-brands" value="'+escapeHtml(editing?editing.brand||'':'')+'" placeholder="VD: Vinamilk, Nestlé"></div>';
  html += '<div class="field"><label>Cửa hàng / Hệ thống</label><input name="store" list="dl-stores" required value="'+escapeHtml(editing?editing.store:'')+'" placeholder="VD: Aeon, Winmart"></div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>Định lượng</label><input name="qty" type="number" step="any" min="0.01" required value="'+(editing?editing.qty:'')+'" placeholder="VD: 1, 500"></div>';
  html += '<div class="field"><label>Đơn vị tính</label><input name="unit" list="dl-units" required value="'+escapeHtml(editing?editing.unit:'')+'" placeholder="lít, kg, g, cái..."></div>';
  html += '</div>';
  html += '<div class="field"><label>Giá</label><input name="price" type="number" step="any" min="0" required value="'+(editing?editing.price:'')+'" placeholder="VNĐ"></div>';
  html += '<div class="field"><label>Ngày cập nhật</label><input name="date" type="date" value="'+(editing?editing.date:todayStr())+'"></div>';

  html += '<button type="button" id="advancedToggleBtn" class="chip-btn" onclick="toggleAdvancedFields()" style="margin-bottom:13px;">'+(showAdvancedFields?'− Ẩn bớt chi tiết':'+ Thêm chi tiết (chi nhánh, danh mục, ảnh...)')+'</button>';

  html += '<div id="advancedFields" style="display:'+(showAdvancedFields?'block':'none')+';">';
  html += '<div class="field"><label>Chi nhánh</label><input name="branch" list="dl-branches" value="'+escapeHtml(editing?editing.branch||'':'')+'" placeholder="VD: Long Biên (nếu có)"></div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>Danh mục (có thể nhập nhiều, cách nhau bởi dấu phẩy)</label><input name="category" list="dl-categories" value="'+escapeHtml(editing&&editing.categories?editing.categories.join(', '):'')+'" placeholder="VD: Gia vị, Đồ khô"></div>';
  html += '<div class="field"><label>Danh mục con</label><input name="subcategory" list="dl-subcategories" value="'+escapeHtml(editing?editing.subcategory||'':'')+'" placeholder="VD: Muối"></div>';
  html += '</div>';
  html += '<div class="field"><label>Danh mục con cấp 2</label><input name="subcategory2" list="dl-subcategories2" value="'+escapeHtml(editing?editing.subcategory2||'':'')+'" placeholder="VD: Muối tinh"></div>';
  html += '<div class="field"><label>Loại bao bì</label><input name="packageType" list="dl-package-types" value="'+escapeHtml(editing?editing.package_type||'':'')+'" placeholder="VD: lon, hộp giấy, túi..."></div>';
  html += '<div class="field"><label>Giá sau khuyến mãi</label><input name="salePrice" type="number" step="any" min="0" value="'+(editing&&editing.sale_price!=null?editing.sale_price:'')+'" placeholder="Nếu có"></div>';
  html += '<div class="field"><label>Hình ảnh</label>';
  if(editing && editing.image_url && !removeImageFlag){
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
    html += '<img src="'+escapeHtml(editing.image_url)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">';

  html += '<div class="modal-actions">';

  html += '</div>';
  html += '</form>';

  html += '<datalist id="dl-units">'+unitsList.map(n=>'<option value="'+escapeHtml(n)+'">').join('')+'</datalist>';
  html += '<datalist id="dl-package-types">'+packageTypesList.map(n=>'<option value="'+escapeHtml(n)+'">').join('')+'</datalist>';
  html += '</div></div>';
  return html;
}

async function initAuth(){
  if(NOT_CONFIGURED){ loaded = true; render(); return; }
  const { data } = await sb.auth.getSession();
  session = data.session;
  locked = !session;
  if(locked){
    render();
  }else{
    await loadData();
  }
  sb.auth.onAuthStateChange((event, newSession)=>{
    session = newSession;
    if(event === 'PASSWORD_RECOVERY'){
      authMode = 'reset';
      locked = true;
      render();
      return;
    }
    if(!newSession){
      locked = true;
      render();
    }
  });
}
initAuth();
